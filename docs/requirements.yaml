# Every requirement from the organiser's slides, with how we prove it.
# /checkpoint reads this file, runs or inspects each `check`, and prints a table.
# Update `status` (todo | partial | done | waived) and `evidence` (file, command or screenshot)
# as phases complete. Never mark `done` without evidence.

