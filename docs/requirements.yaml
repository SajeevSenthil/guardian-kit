  - {id: D1-4.1, text: "Identify at least one supply-chain anomaly", phase: 4, check: "guardian scorecard <run>: GT-C1..C7", status: todo, evidence: ""}
  - {id: D1-5.1, text: "Show what was detected", phase: 6, check: "UI Findings page", status: todo, evidence: ""}
  - {id: D1-5.2, text: "Which component is affected", phase: 6, check: "component purl on every finding", status: todo, evidence: ""}
