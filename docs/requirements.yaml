  - {id: D1-2.3, text: "Identify where each component originates", phase: 2, check: "origin + trusted/untrusted/unknown per component", status: todo, evidence: ""}
  - {id: D1-2.4, text: "Inspect at least one container image or CI/CD workflow", phase: 2, check: "Dockerfile and workflow inventory present (we do both)", status: todo, evidence: ""}
  - {id: D1-3.1, text: "Correlate components with known vulnerabilities", phase: 3, check: "guardian vulns <run>", status: todo, evidence: ""}
