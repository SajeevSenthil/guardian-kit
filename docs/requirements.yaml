  - {id: DEL-2, text: "Architecture overview: agents, tools, data sources, AI interactions, approval points, evidence storage", check: "docs/ARCHITECTURE.md + exported diagram", status: todo, evidence: ""}
  - {id: DEL-3, text: "Source code, configuration, setup instructions, sample policies, prompts, known limitations", check: "README, guardian.toml, policy/, guardian/agents/prompts/, docs/KNOWN_LIMITATIONS.md", status: todo, evidence: ""}
  - {id: DEL-4, text: "Live demonstration: discovery, detection, prioritization, remediation, approval, validation", check: "demo/RUNBOOK.md + recorded replay", status: todo, evidence: ""}
  - {id: DEL-5, text: "Guardian report, human-readable and machine-readable, with all five listed contents", check: "guardian report <run>", status: todo, evidence: ""}
  - {id: DEL-6, text: "Responsible AI & security note", check: "docs/RESPONSIBLE_AI.md with pointers to code/tests", status: todo, evidence: ""}

