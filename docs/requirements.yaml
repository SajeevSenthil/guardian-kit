  - {id: D1-1.2, text: "Identify direct and transitive dependencies", phase: 2, check: "inventory.head.json has direct flag; counts printed", status: todo, evidence: ""}
  - {id: D1-1.3, text: "Capture component names and versions", phase: 2, check: "every component has name + version or is listed as unknown", status: todo, evidence: ""}
