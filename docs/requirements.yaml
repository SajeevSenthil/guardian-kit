  - {id: D2-2.2, text: "Compare package versions, manifests or lockfiles", phase: 9, check: "capability diff 1.0.0 -> 1.0.1; lockfile diff", status: todo, evidence: ""}
  - {id: D2-2.3, text: "Identify suspicious scripts, provenance gaps or integrity changes", phase: 9, check: "install-script, origin and integrity findings", status: todo, evidence: ""}
