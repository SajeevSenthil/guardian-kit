  - {id: D2-4.6, text: "Detect newly introduced vulnerabilities or dependencies", phase: 11, check: "new_findings check; the failed first candidate in the loop", status: todo, evidence: ""}
  - {id: D2-5.1, text: "Report: original finding and supporting evidence", phase: 12, check: "report section", status: todo, evidence: ""}
