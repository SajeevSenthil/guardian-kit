rules:
  - {id: R-1, text: "Free, open-source application from a public repository", check: "README names snyk-labs/nodejs-goof, commit, Apache-2.0", status: todo, evidence: ""}
  - {id: R-2, text: "Realistic dependency tree with direct and transitive dependencies", check: "component counts in README", status: todo, evidence: ""}
  - {id: R-3, text: "Containerized and runnable locally", check: "smoke test passes", status: todo, evidence: ""}
  - {id: R-4, text: "Build, test and scan locally", check: "phase 0 + phase 11", status: todo, evidence: ""}
  - {id: R-5, text: "Document repository, setup steps, dependencies and tools used", check: "README sections", status: todo, evidence: ""}
  - {id: R-6, text: "No scanning or attacking real production systems", check: "tools only take paths under ./target or the run dir; app bound to 127.0.0.1; hook blocks common network scanners", status: todo, evidence: ""}
  - {id: R-7, text: "No access outside the authorized sandbox", check: "read-only public advisory/registry lookups only; documented list of hosts", status: todo, evidence: ""}
  - {id: R-8, text: "No publishing malicious or modified packages to public registries", check: "seeds are private file: tarballs; hook blocks publish", status: todo, evidence: ""}
  - {id: R-9, text: "No real credentials, secrets or access tokens exposed or used", check: "redaction tests; grep runs/ for key patterns", status: todo, evidence: ""}
  - {id: R-10, text: "No automatic merge, deploy or release without human approval", check: "approval-hash test; target has no git remote; no code path pushes or opens a PR; hook blocks git push and gh pr", status: todo, evidence: ""}
  - {id: R-11, text: "No impact on other teams or shared infrastructure", check: "everything local; unique compose project names", status: todo, evidence: ""}

