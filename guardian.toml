# Guardian configuration (starter). Loaded by guardian/config.py.

[run]
default_mode = "live"            # live | replay | offline
top_n_for_agents = 5            # findings sent to Risk Analyst + Refuter
agent_concurrency = 1

[models]                         # UNUSED (original Claude design); runtime agents use [agents.gemini] below
change_detective = "sonnet"
risk_analyst = "sonnet"
refuter = "opus"                 # deliberately a different model from the analyst
remediation_planner = "sonnet"
diagnostician = "sonnet"
reporter = "haiku"               # optional stretch agent (phase 13)

[score.weights]                  # must sum to 100
severity = 30
exploitability = 25
reachability = 20
exposure = 15
fix_availability = 10

[score.priors]                   # used when a factor is unknown (never zero)
severity = 0.6
exploitability = 0.4
reachability = 0.5
exposure = 0.6
fix_availability = 0.6

[score.bands]
critical = 85  
high = 65
medium = 40
low = 15

[context]                        # application context the team asserts (shown as an assumption)
internet_facing = true
service_name = "goof"

[trust]
npm_registries = ["https://registry.npmjs.org/"]
image_registries = ["docker.io/library"]
allowed_install_scripts = []     # package names whose install scripts a human reviewed
popular_names_path = "guardian/data/popular_npm_names.txt"
api_hosts = ["api.osv.dev", "api.first.org", "www.cisa.gov", "registry.npmjs.org", "api.npmjs.org", "api.deps.dev"]
min_release_age_days = 7         # cool-down for brand-new versions

[limits]
tool_timeout_s = 180
build_timeout_s = 600
agent_max_turns = 8
agent_max_budget_usd = 0.60     # UNUSED: no dollar cap is enforced; tokens are capped by [agents]

[agents]                         # runtime agents (phase 9+). Provider: Gemini REST API (stdlib client).
provider = "gemini"
max_output_tokens = 8192
token_budget_per_agent = 120000

[agents.gemini]                  # confirm with `python -m guardian doctor` (lists the models your key can use)
default = "gemini-3.8-flash"
change_detective = "gemini-3.8-flash"
risk_analyst = "gemini-3.8-flash"
refuter = "gemini-3.5-flash-lite"   # a different model from the analyst (2.5 models return 404 for new keys)
remediation_planner = "gemini-3.8-flash"
diagnostician = "gemini-3.8-flash"

[sources]                        # v2: which git repos may be cloned (local paths and uploaded zips are always allowed)
# "*" = any https repository (the default). To restrict, list "host", "host/owner" or "host/owner/repo" entries,
# e.g. allow = ["github.com/SajeevSenthil"]. Consent (name + "I am authorised") is always required and audited.
allow = ["*"]
max_mb = 200                     # refuse a checkout larger than this
max_depsdev_lookups = 150        # direct packages resolved through api.deps.dev per graph run
