[pytest]
markers =
    e2e: end-to-end run on ./target (real npm installs; several minutes; needs the demo target)
addopts = -m "not e2e"
# Only our own tests. Never collect (= import = execute) code from analysed repositories.
testpaths = tests
norecursedirs = workspaces target target.build.* runs .cache tools node_modules .git .venv
